<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post-PTCA Recovery Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@600;700&family=Noto+Serif+Devanagari:wght@600;700&family=Noto+Serif+Bengali:wght@600;700&family=Noto+Serif+Gurmukhi:wght@600;700&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Sans+Gurmukhi:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F7F5;
    --card:#FFFFFF;
    --ink:#16232B;
    --ink-soft:#4B5B62;
    --teal:#1F6F5C;
    --teal-light:#E4F0EB;
    --teal-line:#BFDAD0;
    --amber:#A9662A;
    --amber-light:#F7ECDD;
    --coral:#B9402A;
    --coral-light:#FBEAE6;
    --slate:#3D5A73;
    --slate-light:#E9EEF2;
    --line:#DCE3E0;
    --shadow: 0 1px 2px rgba(22,35,43,0.04), 0 8px 24px -12px rgba(22,35,43,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Noto Sans","Noto Sans Devanagari","Noto Sans Bengali","Noto Sans Gurmukhi",sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
  }
  h1,h2,h3,.serif{
    font-family:"Noto Serif","Noto Serif Devanagari","Noto Serif Bengali","Noto Serif Gurmukhi",serif;
    font-weight:700;
    margin:0;
  }
  .eyebrow{
    font-family:"JetBrains Mono",monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--teal);
    font-weight:500;
  }
  a{color:var(--slate);}
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:2px solid var(--slate);outline-offset:2px;}

  /* ---- Top bar ---- */
  .topbar{
    position:sticky;top:0;z-index:40;
    background:rgba(245,247,245,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    padding:12px 20px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:30px;height:30px;flex:none;
  }
  .brand-name{font-size:14px;font-weight:700;font-family:"Noto Serif","Noto Serif Devanagari","Noto Serif Bengali","Noto Serif Gurmukhi",serif;line-height:1.15;}
  .brand-sub{font-size:10.5px;color:var(--ink-soft);}
  .langswitch{display:flex;background:var(--slate-light);border-radius:999px;padding:3px;gap:2px;}
  .langswitch button{
    border:none;background:transparent;color:var(--slate);
    font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;
    transition:background .15s,color .15s;
  }
  .langswitch button.active{background:var(--slate);color:#fff;}

  /* ---- Hero ---- */
  .hero{max-width:920px;margin:0 auto;padding:40px 20px 8px;}
  .hero h1{font-size:clamp(26px,4.4vw,38px);letter-spacing:-0.01em;color:var(--ink);}
  .hero p.tagline{margin-top:10px;font-size:15.5px;color:var(--ink-soft);max-width:60ch;}

  /* ---- Pulse timeline signature ---- */
  .pulse-wrap{max-width:920px;margin:26px auto 6px;padding:0 20px;}
  .pulse-rail{
    position:relative;
    background:linear-gradient(180deg,var(--card),var(--card));
    border:1px solid var(--line);
    border-radius:16px;
    padding:22px 18px 16px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .pulse-svg{width:100%;height:46px;display:block;}
  .pulse-stages{
    display:grid;grid-template-columns:repeat(5,1fr);
    margin-top:6px;
  }
  .pulse-stage{text-align:center;font-size:11.5px;color:var(--ink-soft);font-weight:600;padding-top:4px;}
  .pulse-stage .dot{
    width:8px;height:8px;border-radius:50%;background:var(--teal);
    margin:0 auto 6px;
  }

  /* ---- Red flag banner ---- */
  .redflag{
    max-width:920px;margin:22px auto 0;padding:0 20px;
  }
  .redflag-inner{
    background:var(--coral-light);
    border:1px solid #EBC4BA;
    border-radius:14px;
    padding:14px 16px;
    display:flex;gap:12px;align-items:flex-start;
  }
  .redflag-inner svg{flex:none;margin-top:2px;color:var(--coral);}
  .redflag-title{font-weight:700;color:var(--coral);font-size:13.5px;margin-bottom:3px;}
  .redflag-text{font-size:13.5px;color:#5c2a1d;}

  /* ---- Section grid ---- */
  .sections{max-width:920px;margin:32px auto 0;padding:0 20px;display:flex;flex-direction:column;gap:16px;}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    box-shadow:var(--shadow);overflow:hidden;
  }
  .card-head{
    display:flex;align-items:center;gap:12px;padding:16px 18px;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .card-icon{
    width:38px;height:38px;border-radius:10px;flex:none;
    display:flex;align-items:center;justify-content:center;
    background:var(--teal-light);color:var(--teal);
  }
  .card-title{font-size:17px;font-weight:700;font-family:"Noto Serif","Noto Serif Devanagari","Noto Serif Bengali","Noto Serif Gurmukhi",serif;flex:1;}
  .card-chevron{transition:transform .18s;color:var(--ink-soft);flex:none;}
  .card.open .card-chevron{transform:rotate(180deg);}
  .card-body{
    max-height:0;overflow:hidden;transition:max-height .25s ease;
  }
  .card.open .card-body{max-height:2000px;}
  .card-body-inner{padding:0 18px 18px;border-top:1px solid var(--line);}
  .stage-row{
    display:grid;grid-template-columns:96px 1fr;gap:14px;
    padding:14px 0;border-bottom:1px dashed var(--line);
    position:relative;
  }
  .stage-row:last-child{border-bottom:none;}
  .stage-label{
    font-size:12px;font-weight:700;color:var(--teal);
    position:relative;padding-left:16px;
  }
  .stage-label::before{
    content:"";position:absolute;left:0;top:4px;width:8px;height:8px;border-radius:50%;background:var(--teal);
  }
  .stage-text{font-size:14.5px;color:var(--ink);}
  .stage-text b{color:var(--ink);}
  .note-chip{
    display:inline-block;margin-top:10px;font-size:12.5px;background:var(--amber-light);
    color:var(--amber);border:1px solid #E9CFA9;padding:6px 10px;border-radius:8px;
  }

  /* ---- Footer ---- */
  .footer{max-width:920px;margin:36px auto 120px;padding:0 20px;font-size:12px;color:var(--ink-soft);}
  .footer .sources{margin-top:6px;}

  /* ---- Chat ---- */
  .chat-fab{
    position:fixed;right:20px;bottom:20px;z-index:50;
    background:var(--ink);color:#fff;border:none;border-radius:999px;
    padding:14px 18px;display:flex;align-items:center;gap:9px;
    box-shadow:0 10px 30px -8px rgba(22,35,43,0.45);
    font-size:14px;font-weight:600;
  }
  .chat-panel{
    position:fixed;right:20px;bottom:20px;z-index:60;
    width:380px;max-width:92vw;height:min(560px,78vh);
    background:var(--card);border-radius:18px;border:1px solid var(--line);
    box-shadow:0 20px 60px -12px rgba(22,35,43,0.4);
    display:none;flex-direction:column;overflow:hidden;
  }
  .chat-panel.open{display:flex;}
  .chat-head{
    background:var(--ink);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;
  }
  .chat-head-title{font-size:14px;font-weight:700;flex:1;font-family:"Noto Serif","Noto Serif Devanagari","Noto Serif Bengali","Noto Serif Gurmukhi",serif;}
  .chat-head-sub{font-size:11px;opacity:.7;}
  .chat-close{background:transparent;border:none;color:#fff;opacity:.8;padding:4px;}
  .chat-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--paper);}
  .msg{max-width:86%;padding:10px 13px;border-radius:14px;font-size:13.5px;line-height:1.45;}
  .msg.bot{background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px;}
  .msg.user{background:var(--teal);color:#fff;align-self:flex-end;border-bottom-right-radius:4px;}
  .msg.typing{background:#fff;border:1px solid var(--line);align-self:flex-start;color:var(--ink-soft);font-style:italic;}
  .chat-input-row{
    border-top:1px solid var(--line);padding:10px;display:flex;gap:8px;background:#fff;
  }
  .chat-input-row input{
    flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;
    background:var(--paper);color:var(--ink);
  }
  .chat-input-row button{
    background:var(--teal);color:#fff;border:none;border-radius:10px;padding:0 14px;font-weight:600;font-size:13px;
  }
  .chat-input-row button:disabled{opacity:.5;}
  .chat-disclaimer{font-size:10.5px;color:var(--ink-soft);padding:6px 14px 10px;background:#fff;}

  /* ---- Booking ---- */
  .book-fab{
    position:fixed;right:20px;bottom:80px;z-index:50;
    background:var(--teal);color:#fff;border:none;border-radius:999px;
    padding:14px 18px;display:flex;align-items:center;gap:9px;
    box-shadow:0 10px 30px -8px rgba(22,35,43,0.45);
    font-size:14px;font-weight:600;
  }
  .book-overlay{
    position:fixed;inset:0;z-index:70;background:rgba(22,35,43,0.5);
    display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:32px 16px;
  }
  .book-overlay.open{display:flex;}
  .book-modal{
    background:var(--card);border-radius:18px;border:1px solid var(--line);
    box-shadow:0 20px 60px -12px rgba(22,35,43,0.4);
    width:480px;max-width:100%;overflow:hidden;
  }
  .book-modal-head{background:var(--ink);color:#fff;padding:16px 18px;display:flex;align-items:center;gap:10px;}
  .book-modal-title{font-size:15px;font-weight:700;flex:1;font-family:"Noto Serif","Noto Serif Devanagari","Noto Serif Bengali","Noto Serif Gurmukhi",serif;}
  .book-modal-sub{font-size:11.5px;opacity:.75;margin-top:2px;}
  .book-modal-close{background:transparent;border:none;color:#fff;opacity:.8;padding:4px;}
  .book-modal-body{padding:18px;max-height:70vh;overflow-y:auto;}
  .book-field{margin-bottom:14px;}
  .book-field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .book-field input,.book-field select,.book-field textarea{
    width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;
    background:#fff;color:var(--ink);font-family:inherit;
  }
  .book-field textarea{resize:vertical;min-height:60px;}
  .book-type-grid{display:grid;grid-template-columns:1fr;gap:8px;}
  .book-type-card{
    border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;
    display:flex;justify-content:space-between;align-items:center;
    font-size:13.5px;font-weight:600;color:var(--ink);background:#fff;text-align:left;
  }
  .book-type-card .fee{color:var(--teal);font-weight:700;}
  .book-type-card.selected{border-color:var(--teal);background:var(--teal-light);}
  .book-slot-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .book-slot-card{border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;font-size:12.5px;font-weight:600;color:var(--ink);background:#fff;}
  .book-slot-card.selected{border-color:var(--teal);background:var(--teal-light);color:var(--teal);}
  .book-fee-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px dashed var(--line);margin-top:6px;font-weight:700;font-size:14.5px;}
  .book-error{color:var(--coral);font-size:12.5px;margin:6px 0 0;}
  .book-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;}
  .book-success{padding:6px 0;}
  .book-success h3{font-size:16px;margin-bottom:8px;}
  .book-success p{font-size:13.5px;color:var(--ink-soft);line-height:1.5;}
  .book-disclaimer{font-size:11px;color:var(--ink-soft);margin-top:12px;}
  .btn-whatsapp{background:#25D366;color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;gap:7px;text-decoration:none;cursor:pointer;}
  .btn-whatsapp:hover{background:#1ebe5d;}
  .book-wa-divider{text-align:center;font-size:12px;color:var(--ink-soft);margin:10px 0;position:relative;}
  .book-wa-divider::before,.book-wa-divider::after{content:'';position:absolute;top:50%;width:40%;height:1px;background:var(--line);}
  .book-wa-divider::before{left:0;} .book-wa-divider::after{right:0;}
  .book-list{list-style:none;margin:0;padding:0;}
  .book-list li{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13px;}
  .book-list .b-top{display:flex;justify-content:space-between;font-weight:700;}
  .book-list button{margin-top:6px;background:transparent;border:1px solid var(--coral);color:var(--coral);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600;}

  @media (max-width:520px){
    .stage-row{grid-template-columns:1fr;gap:4px;}
    .pulse-stage{font-size:9.5px;}
    .chat-panel{right:10px;left:10px;width:auto;bottom:10px;height:74vh;}
    .chat-fab{right:16px;bottom:16px;padding:12px 16px;}
    .book-fab{right:16px;bottom:78px;padding:12px 16px;}
    .book-slot-grid{grid-template-columns:1fr;}
  }

  /* ---- Evaluation wizard ---- */
  .eval-wrap{max-width:920px;margin:22px auto 0;padding:0 20px;}
  .eval-card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    box-shadow:var(--shadow);overflow:hidden;
  }
  .eval-head{
    padding:18px 20px 14px;border-bottom:1px solid var(--line);
    background:linear-gradient(135deg,var(--teal-light),var(--card) 70%);
  }
  .eval-head-title{font-size:18px;}
  .eval-head-sub{font-size:13px;color:var(--ink-soft);margin-top:4px;}
  .eval-progress{display:flex;gap:5px;margin-top:14px;}
  .eval-progress .dot{height:4px;flex:1;border-radius:3px;background:var(--line);}
  .eval-progress .dot.done{background:var(--teal);}
  .eval-body{padding:18px 20px 20px;}
  .eval-step-label{font-size:11.5px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--teal);margin-bottom:6px;}
  .eval-question{font-size:16px;font-weight:700;font-family:"Noto Serif","Noto Serif Devanagari","Noto Serif Bengali","Noto Serif Gurmukhi",serif;margin-bottom:14px;}
  .option-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .option-grid.single-col{grid-template-columns:1fr;}
  .option-card{
    border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;
    font-size:13.5px;font-weight:600;color:var(--ink);background:#fff;
    text-align:left;transition:border-color .15s,background .15s;
  }
  .option-card .sub{display:block;font-weight:400;font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .option-card.selected{border-color:var(--teal);background:var(--teal-light);color:var(--teal);}
  .duration-row{display:flex;gap:10px;align-items:center;}
  .duration-row input[type=number]{
    flex:1;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15px;
    background:#fff;color:var(--ink);
  }
  .unit-toggle{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;}
  .unit-toggle button{border:none;background:#fff;padding:12px 16px;font-size:13px;font-weight:600;color:var(--ink-soft);}
  .unit-toggle button.active{background:var(--teal);color:#fff;}
  .wizard-nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px;}
  .btn{border:none;border-radius:10px;padding:11px 18px;font-size:13.5px;font-weight:700;}
  .btn-primary{background:var(--teal);color:#fff;}
  .btn-primary:disabled{opacity:.4;}
  .btn-ghost{background:transparent;color:var(--ink-soft);}
  .btn-ghost:hover{color:var(--ink);}
  .eval-results{padding:18px 20px 20px;border-top:1px solid var(--line);}
  .result-item{border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:10px;}
  .result-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;}
  .result-activity{font-weight:700;font-size:14px;}
  .badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;}
  .badge.go{background:var(--teal-light);color:var(--teal);}
  .badge.wait{background:var(--slate-light);color:var(--slate);}
  .badge.caution{background:var(--amber-light);color:var(--amber);}
  .badge.defer{background:var(--coral-light);color:var(--coral);}
  .result-reason{font-size:13px;color:var(--ink-soft);}
  .eval-disclaimer{font-size:11.5px;color:var(--ink-soft);margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);}
  .eval-restart{margin-top:14px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 32 32" fill="none">
      <circle cx="16" cy="16" r="15" stroke="#1F6F5C" stroke-width="1.6"/>
      <path d="M5 16h4l2.2-6 3.6 12 3-9 1.8 5.5L21 16h6" stroke="#1F6F5C" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div>
      <div class="brand-name" id="brandName">Post-PTCA Recovery Guide</div>
      <div class="brand-sub" id="brandSub">Dr Chandrashekhar MD DM CARDIOLOGY</div>
    </div>
  </div>
  <div class="langswitch" id="langswitch">
    <button data-lang="en">EN</button>
    <button data-lang="hi">हिं</button>
    <button data-lang="pa">ਪੰ</button>
    <button data-lang="bn">বাং</button>
  </div>
</div>

<div class="hero">
  <span class="eyebrow" id="eyebrow">DAILY LIFE AFTER ANGIOPLASTY</span>
  <h1 id="heroTitle"></h1>
  <p class="tagline" id="heroTag"></p>
</div>

<div class="pulse-wrap">
  <div class="pulse-rail">
    <svg class="pulse-svg" viewBox="0 0 900 46" preserveAspectRatio="none">
      <polyline points="0,23 130,23 150,23 160,4 172,40 184,12 196,23 260,23 280,23 300,8 316,36 330,23 400,23 430,23 448,10 462,32 476,23 560,23 585,23 602,6 618,38 634,23 720,23 745,23 762,10 778,32 792,23 900,23"
        fill="none" stroke="#1F6F5C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    </svg>
    <div class="pulse-stages" id="pulseStages"></div>
  </div>
</div>

<div class="redflag">
  <div class="redflag-inner">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 9v4M12 16.5h.01M10.3 3.9 1.8 18.5A1.8 1.8 0 0 0 3.35 21.2h17.3a1.8 1.8 0 0 0 1.55-2.7L13.7 3.9a1.8 1.8 0 0 0-3.1 0Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div>
      <div class="redflag-title" id="redflagTitle"></div>
      <div class="redflag-text" id="redflagText"></div>
    </div>
  </div>
</div>

<div class="eval-wrap">
  <div class="eval-card">
    <div class="eval-head">
      <div class="eval-head-title serif" id="evalHeadTitle"></div>
      <div class="eval-head-sub" id="evalHeadSub"></div>
      <div class="eval-progress" id="evalProgress"></div>
    </div>
    <div class="eval-body" id="evalBody"></div>
    <div class="eval-results" id="evalResults" style="display:none;"></div>
  </div>
</div>

<div class="sections" id="sections"></div>


<div class="footer">
  <div id="footerNote"></div>
  <div class="sources" id="footerSources"></div>
</div>

<button class="chat-fab" id="chatFab">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <span id="chatFabLabel">Ask a question</span>
</button>

<div class="chat-panel" id="chatPanel">
  <div class="chat-head">
    <div>
      <div class="chat-head-title" id="chatHeadTitle">Recovery Q&A</div>
      <div class="chat-head-sub" id="chatHeadSub">Based on this guide</div>

  sections:[
    {key:"driving", title:"ड्राइविंग", items:[
      {stage:"पहले 48 घंटे", text:"गाड़ी न चलाएं। सेडेशन का असर, प्रतिक्रिया क्षमता में कमी, और कलाई/ग्रोइन पंक्चर साइट के कारण यह असुरक्षित है।"},
      {stage:"सामान्य, योजनाबद्ध पीसीआई", text:"निजी कार चलाना आमतौर पर <b>1 सप्ताह</b> बाद शुरू किया जा सकता है, जब आप स्वस्थ महसूस करें और पंक्चर वाले अंग को सामान्य रूप से हिला सकें।"},
      {stage:"हार्ट अटैक के बाद पीसीआई", text:"यदि हृदय की पंपिंग क्षमता सामान्य है और कोई अन्य प्रक्रिया योजनाबद्ध नहीं है, तो <b>1 सप्ताह</b> बाद निजी ड्राइविंग संभव है; अन्यथा <b>4 सप्ताह</b> प्रतीक्षा करें।"},
      {stage:"कमर्शियल / पेशेवर चालक", text:"ट्रक, बस, टैक्सी या अन्य कमर्शियल लाइसेंस धारकों को कम से कम <b>6 सप्ताह</b> प्रतीक्षा करनी चाहिए और आमतौर पर स्ट्रेस टेस्ट के साथ कार्डियोलॉजिस्ट की अनुमति आवश्यक है।"}
    ], note:"अपने स्थानीय परिवहन प्राधिकरण के मेडिकल फिटनेस नियमों की भी जांच अवश्य करें।"},
    {key:"flying", title:"हवाई यात्रा", items:[
      {stage:"पहले 48 घंटे", text:"हवाई यात्रा से बचें।"},
      {stage:"छोटी घरेलू उड़ान, सामान्य पीसीआई", text:"यदि आप बिना सीने में दर्द या सांस फूले आराम से चल पा रहे हैं, तो आमतौर पर <b>2–3 दिन</b> बाद यात्रा सुरक्षित है।"},
      {stage:"लंबी / अंतरराष्ट्रीय उड़ान", text:"कम से कम <b>1–2 सप्ताह</b> प्रतीक्षा करें। हर घंटे थोड़ा टहलें, पानी पीते रहें, और रक्त के थक्के के जोखिम को कम करने के लिए कम्प्रेशन स्टॉकिंग्स पर विचार करें।"},
      {stage:"हार्ट अटैक या जटिलताओं के बाद पीसीआई", text:"कम से कम <b>2 सप्ताह</b> (कभी-कभी 4–6 सप्ताह) प्रतीक्षा करें और यात्रा से पहले कार्डियोलॉजिस्ट से स्पष्ट अनुमति लें।"}
    ], note:"अपना डिस्चार्ज सारांश, वर्तमान दवाओं की सूची, और यात्रा/मेडिकल बीमा के दस्तावेज़ साथ रखें।"},
    {key:"sexual", title:"यौन संबंध", items:[
      {stage:"एंजियोप्लास्टी (PCI) के बाद", text:"यदि एक्सेस साइट पर कोई जटिलता न हो, तो सामान्यतः PCI के <b>कुछ दिनों</b> के भीतर यौन संबंध फिर से शुरू किए जा सकते हैं। यदि आपकी प्रक्रिया कलाई (रेडियल एक्सेस) से हुई है, तो आप आमतौर पर उतनी ही जल्दी या उससे भी पहले शुरू कर सकते हैं जितनी जल्दी ग्रोइन (फीमोरल एक्सेस) वाले मरीज़।"},
      {stage:"हार्ट अटैक के बाद", text:"सामान्य हार्ट अटैक के <b>1 सप्ताह या उससे अधिक</b> बाद यौन संबंध फिर से शुरू करना उचित है, जब आपको हल्की-मध्यम शारीरिक गतिविधि के दौरान सीने में दर्द, सांस फूलना या अन्य लक्षण न हों।"},
      {stage:"सामान्य फिटनेस मापदंड", text:"यौन क्रिया हृदय पर हल्के-मध्यम परिश्रम जितना ही भार डालती है — लगभग <b>2 मंज़िल सीढ़ियां</b> तेज़ी से चढ़ने या तेज़ चलने के बराबर। यदि आप बिना सीने में दर्द, सांस फूले, चक्कर या धड़कन अनियमित हुए यह आराम से कर सकें, तो यौन क्रिया आमतौर पर सुरक्षित है।"},
      {stage:"दवाएं — PDE5 इनहिबिटर", text:"PDE5-इनहिबिटर दवाओं (सिल्डेनाफिल, टाडालाफिल, वार्डेनाफिल) को कभी भी नाइट्रेट दवाओं के साथ न लें — इस संयोजन से रक्तचाप में खतरनाक गिरावट हो सकती है। सिल्डेनाफिल या वार्डेनाफिल लेने के बाद <b>24 घंटे</b> तक नाइट्रेट न दें; टाडालाफिल के बाद <b>48 घंटे</b> प्रतीक्षा करें।"},
      {stage:"अपनी हृदय की दवाएं बंद न करें", text:"बीटा-ब्लॉकर और अन्य हृदय दवाएं शायद ही कभी यौन समस्या का असली कारण होती हैं। इस चिंता के कारण अपने हृदय की रक्षा करने वाली दवा खुद बंद या कम न करें — इसके बजाय अपने कार्डियोलॉजिस्ट से चर्चा करें।"},
      {stage:"कब रुकना चाहिए", text:"यदि आपको अस्थिर या बिगड़ता सीने का दर्द, अनियंत्रित हार्ट फेल्योर हो, या यौन क्रिया के दौरान ही सीने में दर्द, तेज़ सांस फूलना या धड़कन अनियमित होना हो, तो जब तक स्थिति स्थिर व समीक्षित न हो जाए, यौन क्रिया टालें।"}
    ], note:"हृदय प्रक्रिया के बाद अंतरंगता फिर से शुरू करने को लेकर चिंता होना मरीज़ और साथी दोनों के लिए सामान्य है। समय और चिंताओं के बारे में अपने कार्डियोलॉजिस्ट या रिहैब टीम से खुलकर बात करना वास्तव में मददगार होता है।"},
    {key:"work", title:"काम पर वापसी", items:[
      {stage:"डेस्क / बैठकर किया जाने वाला काम", text:"स्वस्थ महसूस करने पर आमतौर पर <b>1 सप्ताह</b> बाद।"},
      {stage:"हल्का शारीरिक काम", text:"(खड़े होना, चलना, हल्का सामान उठाना) — आमतौर पर लगभग <b>2 सप्ताह</b> बाद।"},
      {stage:"भारी शारीरिक श्रम", text:"शारीरिक रूप से कठिन कार्यों के लिए <b>4–6 सप्ताह</b> चाहिए, और अक्सर अनुमति से पहले स्ट्रेस टेस्ट आवश्यक होता है।"}
    ], note:"जहां उपलब्ध हो, वहां कार्डियक रिहैबिलिटेशन कार्यक्रम में शामिल होना काम और रोज़मर्रा की गतिविधियों में सुरक्षित व आत्मविश्वास भरी वापसी में मदद करता है।"},
    {key:"gym", title:"जिम और व्यायाम", items:[
      {stage:"दिन 1–2", text:"सहनशक्ति के अनुसार घर के अंदर हल्की सैर करें। पंक्चर वाले हाथ/पैर पर ज़ोर डालने या भारी सामान उठाने से बचें।"},
      {stage:"सप्ताह 1", text:"रोज़ छोटी सैर (10–15 मिनट), धीरे-धीरे बढ़ाते हुए।"},
      {stage:"सप्ताह 2", text:"सैर की अवधि बढ़ाएं; हल्की स्टेशनरी साइकिलिंग करें। एक्सेस साइट पूरी तरह ठीक होने तक तैराकी से बचें।"},
      {stage:"सप्ताह 2–4", text:"यदि नामांकित हैं, तो संरचित कार्डियक रिहैबिलिटेशन व्यायाम कार्यक्रम शुरू करें।"},
      {stage:"सप्ताह 4–6", text:"अपनी रिहैब टीम के मार्गदर्शन में हल्के वज़न के साथ हल्का जिम/रेजिस्टेंस प्रशिक्षण।"},
      {stage:"अनुमति मिलने के बाद", text:"भारी वेटलिफ्टिंग, प्रतिस्पर्धी खेल या तीव्र-तीव्रता वाला प्रशिक्षण केवल कार्डियोलॉजिस्ट की अनुमति के बाद, जो आमतौर पर लगभग 6 सप्ताह में ट्रेडमिल/स्ट्रेस टेस्ट से पुष्ट की जाती है।"}
    ], note:"तीव्र लेकिन छोटे प्रयासों की बजाय नियमित मध्यम गतिविधि ही आपके हृदय की दीर्घकालिक सुरक्षा करती है।"},
    {key:"meds", title:"स्टेंट के बाद दवाएं", items:[
      {stage:"डुअल एंटीप्लेटलेट थेरेपी (DAPT)", text:"एस्पिरिन के साथ P2Y12 इनहिबिटर (टिकाग्रेलोर, प्रासुग्रेल या क्लोपिडोग्रेल) डॉक्टर की सलाह अनुसार लेते रहें — हार्ट अटैक/ACS के बाद लगे स्टेंट के लिए आमतौर पर लगभग <b>12 महीने</b> तक।"},
      {stage:"2025 अपडेट", text:"2025 के ACC/AHA ACS दिशानिर्देश के अनुसार, अधिक ब्लीडिंग जोखिम वाले कुछ मरीज़ों में केवल <b>1 महीने</b> बाद एस्पिरिन बंद कर सिर्फ एक एंटीप्लेटलेट दवा (अक्सर टिकाग्रेलोर) जारी रखी जा सकती है — यह निर्णय आपके कार्डियोलॉजिस्ट द्वारा व्यक्तिगत आधार पर लिया जाता है, खुद से नहीं।"},
      {stage:"खुद से बंद न करें", text:"एंटीप्लेटलेट दवाएं अचानक खुद बंद करने से स्टेंट में रुकावट (स्टेंट थ्रोम्बोसिस) का खतरा काफी बढ़ जाता है, जिससे हार्ट अटैक हो सकता है।"},
      {stage:"किसी अन्य प्रक्रिया से पहले", text:"किसी भी अन्य डॉक्टर, सर्जन या दंत चिकित्सक को बताएं कि आप एंटीप्लेटलेट थेरेपी पर हैं — अपने कार्डियोलॉजिस्ट की विशेष सलाह के बिना इसे किसी प्रक्रिया के लिए बंद न करें।"}
    ], note:"यह भाग 2025 के ACC/AHA/ACEP/NAEMSP/SCAI ACS दिशानिर्देश अपडेट पर आधारित है।"}

    {key:"driving", title:"ਡਰਾਈਵਿੰਗ", items:[
      {stage:"ਪਹਿਲੇ 48 ਘੰਟੇ", text:"ਗੱਡੀ ਨਾ ਚਲਾਓ। ਸੈਡੇਸ਼ਨ ਦਾ ਅਸਰ, ਘਟੀ ਪ੍ਰਤੀਕਿਰਿਆ ਸਮਰੱਥਾ, ਅਤੇ ਗੁੱਟ/ਗਰੋਇਨ ਪੰਕਚਰ ਥਾਂ ਕਾਰਨ ਇਹ ਅਸੁਰੱਖਿਅਤ ਹੈ।"},
      {stage:"ਆਮ, ਯੋਜਨਾਬੱਧ ਪੀਸੀਆਈ", text:"ਨਿੱਜੀ ਕਾਰ ਚਲਾਉਣਾ ਆਮ ਤੌਰ 'ਤੇ <b>1 ਹਫ਼ਤੇ</b> ਬਾਅਦ ਸ਼ੁਰੂ ਕੀਤਾ ਜਾ ਸਕਦਾ ਹੈ, ਜਦੋਂ ਤੁਸੀਂ ਠੀਕ ਮਹਿਸੂਸ ਕਰੋ ਅਤੇ ਪੰਕਚਰ ਵਾਲੇ ਅੰਗ ਨੂੰ ਆਸਾਨੀ ਨਾਲ ਹਿਲਾ ਸਕੋ।"},
      {stage:"ਦਿਲ ਦੇ ਦੌਰੇ ਤੋਂ ਬਾਅਦ ਪੀਸੀਆਈ", text:"ਜੇ ਦਿਲ ਦੀ ਪੰਪਿੰਗ ਸਮਰੱਥਾ ਠੀਕ ਹੈ ਅਤੇ ਕੋਈ ਹੋਰ ਪ੍ਰਕਿਰਿਆ ਯੋਜਨਾਬੱਧ ਨਹੀਂ, ਤਾਂ <b>1 ਹਫ਼ਤੇ</b> ਬਾਅਦ ਨਿੱਜੀ ਡਰਾਈਵਿੰਗ ਸੰਭਵ ਹੈ; ਨਹੀਂ ਤਾਂ <b>4 ਹਫ਼ਤੇ</b> ਉਡੀਕ ਕਰੋ।"},
      {stage:"ਕਮਰਸ਼ੀਅਲ / ਪੇਸ਼ੇਵਰ ਡਰਾਈਵਰ", text:"ਟਰੱਕ, ਬੱਸ, ਟੈਕਸੀ ਜਾਂ ਹੋਰ ਕਮਰਸ਼ੀਅਲ ਲਾਇਸੈਂਸ ਧਾਰਕਾਂ ਨੂੰ ਘੱਟੋ-ਘੱਟ <b>6 ਹਫ਼ਤੇ</b> ਉਡੀਕ ਕਰਨੀ ਚਾਹੀਦੀ ਹੈ ਅਤੇ ਆਮ ਤੌਰ 'ਤੇ ਸਟ੍ਰੈੱਸ ਟੈਸਟ ਸਮੇਤ ਕਾਰਡੀਓਲੋਜਿਸਟ ਦੀ ਮਨਜ਼ੂਰੀ ਲੋੜੀਂਦੀ ਹੈ।"}
    ], note:"ਆਪਣੇ ਸਥਾਨਕ ਟਰਾਂਸਪੋਰਟ ਅਥਾਰਟੀ ਦੇ ਮੈਡੀਕਲ ਫਿਟਨੈਸ ਨਿਯਮਾਂ ਦੀ ਵੀ ਜਾਂਚ ਕਰੋ।"},
    {key:"flying", title:"ਹਵਾਈ ਸਫ਼ਰ", items:[
      {stage:"ਪਹਿਲੇ 48 ਘੰਟੇ", text:"ਹਵਾਈ ਸਫ਼ਰ ਤੋਂ ਬਚੋ।"},
      {stage:"ਛੋਟੀ ਘਰੇਲੂ ਉਡਾਣ, ਆਮ ਪੀਸੀਆਈ", text:"ਜੇ ਤੁਸੀਂ ਬਿਨਾਂ ਛਾਤੀ ਦੇ ਦਰਦ ਜਾਂ ਸਾਹ ਚੜ੍ਹੇ ਆਰਾਮ ਨਾਲ ਤੁਰ ਸਕਦੇ ਹੋ, ਤਾਂ ਆਮ ਤੌਰ 'ਤੇ <b>2–3 ਦਿਨਾਂ</b> ਬਾਅਦ ਸਫ਼ਰ ਸੁਰੱਖਿਅਤ ਹੈ।"},
      {stage:"ਲੰਬੀ / ਅੰਤਰਰਾਸ਼ਟਰੀ ਉਡਾਣ", text:"ਘੱਟੋ-ਘੱਟ <b>1–2 ਹਫ਼ਤੇ</b> ਉਡੀਕ ਕਰੋ। ਹਰ ਘੰਟੇ ਥੋੜ੍ਹਾ ਤੁਰੋ, ਪਾਣੀ ਪੀਂਦੇ ਰਹੋ, ਅਤੇ ਖੂਨ ਦੇ ਥੱਕੇ ਦਾ ਖਤਰਾ ਘਟਾਉਣ ਲਈ ਕੰਪਰੈਸ਼ਨ ਸਟੌਕਿੰਗਜ਼ 'ਤੇ ਵਿਚਾਰ ਕਰੋ।"},
      {stage:"ਦਿਲ ਦੇ ਦੌਰੇ ਜਾਂ ਜਟਿਲਤਾਵਾਂ ਤੋਂ ਬਾਅਦ ਪੀਸੀਆਈ", text:"ਘੱਟੋ-ਘੱਟ <b>2 ਹਫ਼ਤੇ</b> (ਕਈ ਵਾਰ 4–6 ਹਫ਼ਤੇ) ਉਡੀਕ ਕਰੋ ਅਤੇ ਸਫ਼ਰ ਤੋਂ ਪਹਿਲਾਂ ਕਾਰਡੀਓਲੋਜਿਸਟ ਤੋਂ ਸਪਸ਼ਟ ਮਨਜ਼ੂਰੀ ਲਓ।"}
    ], note:"ਆਪਣਾ ਡਿਸਚਾਰਜ ਸਾਰ, ਮੌਜੂਦਾ ਦਵਾਈਆਂ ਦੀ ਸੂਚੀ, ਅਤੇ ਸਫ਼ਰ/ਮੈਡੀਕਲ ਬੀਮੇ ਦੇ ਕਾਗਜ਼ਾਤ ਨਾਲ ਰੱਖੋ।"},
    {key:"sexual", title:"ਸਰੀਰਕ ਸੰਬੰਧ", items:[
      {stage:"ਐਂਜੀਓਪਲਾਸਟੀ (PCI) ਤੋਂ ਬਾਅਦ", text:"ਜੇ ਐਕਸੈਸ ਥਾਂ 'ਤੇ ਕੋਈ ਜਟਿਲਤਾ ਨਾ ਹੋਵੇ, ਤਾਂ ਆਮ ਤੌਰ 'ਤੇ PCI ਦੇ <b>ਕੁਝ ਦਿਨਾਂ</b> ਅੰਦਰ ਸਰੀਰਕ ਸੰਬੰਧ ਮੁੜ ਸ਼ੁਰੂ ਕੀਤੇ ਜਾ ਸਕਦੇ ਹਨ। ਜੇ ਤੁਹਾਡੀ ਪ੍ਰਕਿਰਿਆ ਗੁੱਟ (ਰੇਡੀਅਲ ਐਕਸੈਸ) ਰਾਹੀਂ ਹੋਈ ਹੈ, ਤਾਂ ਤੁਸੀਂ ਆਮ ਤੌਰ 'ਤੇ ਗਰੋਇਨ (ਫੀਮੋਰਲ ਐਕਸੈਸ) ਵਾਲੇ ਮਰੀਜ਼ਾਂ ਜਿੰਨੀ ਜਲਦੀ ਜਾਂ ਉਸ ਤੋਂ ਵੀ ਪਹਿਲਾਂ ਸ਼ੁਰੂ ਕਰ ਸਕਦੇ ਹੋ।"},
      {stage:"ਦਿਲ ਦੇ ਦੌਰੇ ਤੋਂ ਬਾਅਦ", text:"ਆਮ ਦਿਲ ਦੇ ਦੌਰੇ ਦੇ <b>1 ਹਫ਼ਤੇ ਜਾਂ ਵਧੇਰੇ</b> ਬਾਅਦ ਸਰੀਰਕ ਸੰਬੰਧ ਮੁੜ ਸ਼ੁਰੂ ਕਰਨਾ ਉਚਿਤ ਹੈ, ਜਦੋਂ ਤੁਹਾਨੂੰ ਹਲਕੀ-ਦਰਮਿਆਨੀ ਸਰੀਰਕ ਗਤੀਵਿਧੀ ਦੌਰਾਨ ਛਾਤੀ ਵਿੱਚ ਦਰਦ, ਸਾਹ ਚੜ੍ਹਨਾ ਜਾਂ ਹੋਰ ਲੱਛਣ ਨਾ ਹੋਣ।"},
      {stage:"ਆਮ ਫਿਟਨੈਸ ਮਾਪਦੰਡ", text:"ਸਰੀਰਕ ਕਿਰਿਆ ਦਿਲ 'ਤੇ ਹਲਕੇ-ਦਰਮਿਆਨੇ ਮਿਹਨਤ ਜਿੰਨਾ ਹੀ ਭਾਰ ਪਾਉਂਦੀ ਹੈ — ਲਗਭਗ <b>2 ਮੰਜ਼ਿਲਾਂ ਪੌੜੀਆਂ</b> ਤੇਜ਼ੀ ਨਾਲ ਚੜ੍ਹਨ ਜਾਂ ਤੇਜ਼ ਤੁਰਨ ਦੇ ਬਰਾਬਰ। ਜੇ ਤੁਸੀਂ ਬਿਨਾਂ ਛਾਤੀ ਦੇ ਦਰਦ, ਸਾਹ ਚੜ੍ਹੇ, ਚੱਕਰ ਜਾਂ ਧੜਕਣ ਅਨਿਯਮਿਤ ਹੋਏ ਇਹ ਆਰਾਮ ਨਾਲ ਕਰ ਸਕੋ, ਤਾਂ ਸਰੀਰਕ ਕਿਰਿਆ ਆਮ ਤੌਰ 'ਤੇ ਸੁਰੱਖਿਅਤ ਹੈ।"},
      {stage:"ਦਵਾਈਆਂ — PDE5 ਇਨਹਿਬਿਟਰ", text:"PDE5-ਇਨਹਿਬਿਟਰ ਦਵਾਈਆਂ (ਸਿਲਡੇਨਾਫ਼ਿਲ, ਟੈਡਾਲਾਫ਼ਿਲ, ਵਾਰਡੇਨਾਫ਼ਿਲ) ਨੂੰ ਕਦੇ ਵੀ ਨਾਈਟ੍ਰੇਟ ਦਵਾਈਆਂ ਨਾਲ ਨਾ ਲਓ — ਇਸ ਮਿਸ਼ਰਣ ਨਾਲ ਬਲੱਡ ਪ੍ਰੈਸ਼ਰ ਵਿੱਚ ਖ਼ਤਰਨਾਕ ਗਿਰਾਵਟ ਆ ਸਕਦੀ ਹੈ। ਸਿਲਡੇਨਾਫ਼ਿਲ ਜਾਂ ਵਾਰਡੇਨਾਫ਼ਿਲ ਲੈਣ ਤੋਂ ਬਾਅਦ <b>24 ਘੰਟੇ</b> ਤੱਕ ਨਾਈਟ੍ਰੇਟ ਨਾ ਦਿਓ; ਟੈਡਾਲਾਫ਼ਿਲ ਤੋਂ ਬਾਅਦ <b>48 ਘੰਟੇ</b> ਉਡੀਕ ਕਰੋ।"},
      {stage:"ਆਪਣੀਆਂ ਦਿਲ ਦੀਆਂ ਦਵਾਈਆਂ ਬੰਦ ਨਾ ਕਰੋ", text:"ਬੀਟਾ-ਬਲੌਕਰ ਅਤੇ ਹੋਰ ਦਿਲ ਦੀਆਂ ਦਵਾਈਆਂ ਸ਼ਾਇਦ ਹੀ ਕਦੇ ਸਰੀਰਕ ਸਮੱਸਿਆ ਦਾ ਅਸਲ ਕਾਰਨ ਹੁੰਦੀਆਂ ਹਨ। ਇਸ ਚਿੰਤਾ ਕਾਰਨ ਆਪਣੇ ਦਿਲ ਦੀ ਰੱਖਿਆ ਕਰਨ ਵਾਲੀ ਦਵਾਈ ਖ਼ੁਦ ਬੰਦ ਜਾਂ ਘੱਟ ਨਾ ਕਰੋ — ਇਸ ਦੀ ਬਜਾਏ ਆਪਣੇ ਕਾਰਡੀਓਲੋਜਿਸਟ ਨਾਲ ਗੱਲ ਕਰੋ।"},
      {stage:"ਕਦੋਂ ਰੁਕਣਾ ਚਾਹੀਦਾ ਹੈ", text:"ਜੇ ਤੁਹਾਨੂੰ ਅਸਥਿਰ ਜਾਂ ਵਿਗੜਦਾ ਛਾਤੀ ਦਾ ਦਰਦ, ਅਨਿਯੰਤਰਿਤ ਦਿਲ ਦੀ ਅਸਫ਼ਲਤਾ ਹੋਵੇ, ਜਾਂ ਸਰੀਰਕ ਕਿਰਿਆ ਦੌਰਾਨ ਹੀ ਛਾਤੀ ਵਿੱਚ ਦਰਦ, ਤੇਜ਼ ਸਾਹ ਚੜ੍ਹਨਾ ਜਾਂ ਧੜਕਣ ਅਨਿਯਮਿਤ ਹੋਣਾ ਹੋਵੇ, ਤਾਂ ਜਦੋਂ ਤੱਕ ਸਥਿਤੀ ਸਮੀਖਿਆ ਅਤੇ ਸਥਿਰ ਨਾ ਹੋ ਜਾਵੇ, ਸਰੀਰਕ ਕਿਰਿਆ ਟਾਲੋ।"}
    ], note:"ਦਿਲ ਦੀ ਪ੍ਰਕਿਰਿਆ ਤੋਂ ਬਾਅਦ ਨੇੜਤਾ ਮੁੜ ਸ਼ੁਰੂ ਕਰਨ ਨੂੰ ਲੈ ਕੇ ਚਿੰਤਾ ਹੋਣਾ ਮਰੀਜ਼ ਅਤੇ ਸਾਥੀ ਦੋਵਾਂ ਲਈ ਆਮ ਹੈ। ਸਮੇਂ ਅਤੇ ਚਿੰਤਾਵਾਂ ਬਾਰੇ ਆਪਣੇ ਕਾਰਡੀਓਲੋਜਿਸਟ ਜਾਂ ਰੀਹੈਬ ਟੀਮ ਨਾਲ ਖੁੱਲ੍ਹ ਕੇ ਗੱਲ ਕਰਨਾ ਸੱਚਮੁੱਚ ਮਦਦਗਾਰ ਹੁੰਦਾ ਹੈ।"},
    {key:"work", title:"ਕੰਮ 'ਤੇ ਵਾਪਸੀ", items:[
      {stage:"ਡੈਸਕ / ਬੈਠ ਕੇ ਕੀਤਾ ਜਾਣ ਵਾਲਾ ਕੰਮ", text:"ਠੀਕ ਮਹਿਸੂਸ ਕਰਨ 'ਤੇ ਆਮ ਤੌਰ 'ਤੇ <b>1 ਹਫ਼ਤੇ</b> ਬਾਅਦ।"},
      {stage:"ਹਲਕਾ ਸਰੀਰਕ ਕੰਮ", text:"(ਖੜ੍ਹੇ ਹੋਣਾ, ਤੁਰਨਾ, ਹਲਕਾ ਸਮਾਨ ਚੁੱਕਣਾ) — ਆਮ ਤੌਰ 'ਤੇ ਲਗਭਗ <b>2 ਹਫ਼ਤੇ</b> ਬਾਅਦ।"},
      {stage:"ਭਾਰੀ ਸਰੀਰਕ ਮਿਹਨਤ", text:"ਸਰੀਰਕ ਤੌਰ 'ਤੇ ਔਖੇ ਕੰਮਾਂ ਲਈ <b>4–6 ਹਫ਼ਤੇ</b> ਚਾਹੀਦੇ ਹਨ, ਅਤੇ ਅਕਸਰ ਮਨਜ਼ੂਰੀ ਤੋਂ ਪਹਿਲਾਂ ਸਟ੍ਰੈੱਸ ਟੈਸਟ ਲੋੜੀਂਦਾ ਹੁੰਦਾ ਹੈ।"}
    ], note:"ਜਿੱਥੇ ਉਪਲਬਧ ਹੋਵੇ, ਕਾਰਡੀਐਕ ਰੀਹੈਬਿਲੀਟੇਸ਼ਨ ਪ੍ਰੋਗਰਾਮ ਵਿੱਚ ਸ਼ਾਮਲ ਹੋਣਾ ਕੰਮ ਅਤੇ ਰੋਜ਼ਾਨਾ ਗਤੀਵਿਧੀਆਂ ਵਿੱਚ ਸੁਰੱਖਿਅਤ ਤੇ ਭਰੋਸੇਮੰਦ ਵਾਪਸੀ ਵਿੱਚ ਮਦਦ ਕਰਦਾ ਹੈ।"},
    {key:"gym", title:"ਜਿਮ ਅਤੇ ਕਸਰਤ", items:[
      {stage:"ਦਿਨ 1–2", text:"ਸਹਿਣਸ਼ੀਲਤਾ ਅਨੁਸਾਰ ਘਰ ਦੇ ਅੰਦਰ ਹਲਕੀ ਸੈਰ ਕਰੋ। ਪੰਕਚਰ ਵਾਲੇ ਹੱਥ/ਪੈਰ 'ਤੇ ਜ਼ੋਰ ਪਾਉਣ ਜਾਂ ਭਾਰੀ ਸਮਾਨ ਚੁੱਕਣ ਤੋਂ ਬਚੋ।"},
      {stage:"ਹਫ਼ਤਾ 1", text:"ਰੋਜ਼ ਛੋਟੀ ਸੈਰ (10–15 ਮਿੰਟ), ਹੌਲੀ-ਹੌਲੀ ਵਧਾਉਂਦੇ ਹੋਏ।"},
      {stage:"ਹਫ਼ਤਾ 2", text:"ਸੈਰ ਦੀ ਮਿਆਦ ਵਧਾਓ; ਹਲਕੀ ਸਟੇਸ਼ਨਰੀ ਸਾਈਕਲਿੰਗ ਕਰੋ। ਐਕਸੈਸ ਥਾਂ ਪੂਰੀ ਤਰ੍ਹਾਂ ਠੀਕ ਹੋਣ ਤੱਕ ਤੈਰਾਕੀ ਤੋਂ ਬਚੋ।"},
      {stage:"ਹਫ਼ਤਾ 2–4", text:"ਜੇ ਦਾਖਲ ਹੋ, ਤਾਂ ਸੰਗਠਿਤ ਕਾਰਡੀਐਕ ਰੀਹੈਬਿਲੀਟੇਸ਼ਨ ਕਸਰਤ ਪ੍ਰੋਗਰਾਮ ਸ਼ੁਰੂ ਕਰੋ।"},
      {stage:"ਹਫ਼ਤਾ 4–6", text:"ਆਪਣੀ ਰੀਹੈਬ ਟੀਮ ਦੀ ਅਗਵਾਈ ਵਿੱਚ ਹਲਕੇ ਭਾਰ ਨਾਲ ਹਲਕੀ ਜਿਮ/ਰੈਜ਼ਿਸਟੈਂਸ ਸਿਖਲਾਈ।"},
      {stage:"ਮਨਜ਼ੂਰੀ ਤੋਂ ਬਾਅਦ", text:"ਭਾਰੀ ਵੇਟਲਿਫਟਿੰਗ, ਮੁਕਾਬਲੇ ਵਾਲੀ ਖੇਡ ਜਾਂ ਤੀਬਰ ਸਿਖਲਾਈ ਸਿਰਫ਼ ਕਾਰਡੀਓਲੋਜਿਸਟ ਦੀ ਮਨਜ਼ੂਰੀ ਤੋਂ ਬਾਅਦ, ਜੋ ਆਮ ਤੌਰ 'ਤੇ ਲਗਭਗ 6 ਹਫ਼ਤਿਆਂ ਵਿੱਚ ਟ੍ਰੈਡਮਿਲ/ਸਟ੍ਰੈੱਸ ਟੈਸਟ ਨਾਲ ਪੁਸ਼ਟੀ ਕੀਤੀ ਜਾਂਦੀ ਹੈ।"}
    ], note:"ਤੀਬਰ ਪਰ ਥੋੜ੍ਹੇ ਸਮੇਂ ਦੀ ਬਜਾਏ ਨਿਯਮਤ ਦਰਮਿਆਨੀ ਗਤੀਵਿਧੀ ਹੀ ਤੁਹਾਡੇ ਦਿਲ ਦੀ ਲੰਬੇ ਸਮੇਂ ਦੀ ਰਾਖੀ ਕਰਦੀ ਹੈ।"},
    {key:"meds", title:"ਸਟੈਂਟ ਤੋਂ ਬਾਅਦ ਦਵਾਈਆਂ", items:[
      {stage:"ਡਿਊਲ ਐਂਟੀਪਲੇਟਲੈੱਟ ਥੈਰੇਪੀ (DAPT)", text:"ਐਸਪਰੀਨ ਦੇ ਨਾਲ P2Y12 ਇਨਹਿਬਿਟਰ (ਟਿਕਾਗ੍ਰੇਲਰ, ਪ੍ਰਾਸੁਗ੍ਰੇਲ ਜਾਂ ਕਲੋਪੀਡੋਗ੍ਰੇਲ) ਡਾਕਟਰ ਦੀ ਸਲਾਹ ਅਨੁਸਾਰ ਲੈਂਦੇ ਰਹੋ — ਦਿਲ ਦੇ ਦੌਰੇ/ACS ਤੋਂ ਬਾਅਦ ਲੱਗੇ ਸਟੈਂਟ ਲਈ ਆਮ ਤੌਰ 'ਤੇ ਲਗਭਗ <b>12 ਮਹੀਨੇ</b> ਤੱਕ।"},

      {stage:"ওষুধ — PDE5 ইনহিবিটর", text:"PDE5-ইনহিবিটর ওষুধ (সিলডেনাফিল, টাডালাফিল, ভারডেনাফিল) কখনোই নাইট্রেট ওষুধের সঙ্গে খাবেন না — এই মিশ্রণে রক্তচাপ বিপজ্জনকভাবে কমে যেতে পারে। সিলডেনাফিল বা ভারডেনাফিল খাওয়ার পরে <b>২৪ ঘণ্টা</b> নাইট্রেট দেওয়া যাবে না; টাডালাফিলের পরে <b>৪৮ ঘণ্টা</b> অপেক্ষা করুন।"},

/* =========================================================
   PERSONALISED EVALUATION WIZARD
   ========================================================= */
let evalState = { step:1, condition:null, primary:null, secondary:null, durationValue:"", durationUnit:"days", mets:null, activities:[] };

function resetEval(lang){
  evalState = { step:1, condition:null, primary:null, secondary:null, durationValue:"", durationUnit:"days", mets:null, activities:[] };
  const u = DATA[lang].evalUI;
  document.getElementById("evalHeadTitle").textContent = u.title;
  document.getElementById("evalHeadSub").textContent = u.subtitle;
  document.getElementById("evalResults").style.display = "none";
  document.getElementById("evalResults").innerHTML = "";
  renderEvalProgress();
  renderEvalStep();
}

function renderEvalProgress(){
  const u = DATA[currentLang].evalUI;
  const wrap = document.getElementById("evalProgress");
  wrap.innerHTML = u.stepLabels.map((_,i)=>`<div class="dot ${i < evalState.step ? "done":""}"></div>`).join("");
}

function optionCardsHTML(options, groupField, selectedVal, multi){
  return `<div class="option-grid">` + options.map(o=>{
    const isSel = multi ? evalState[groupField].includes(o.id) : selectedVal === o.id;
    return `<button type="button" class="option-card ${isSel?"selected":""}" data-group="${groupField}" data-val="${o.id}" data-multi="${multi?"1":"0"}">
      ${o.label}${o.sub ? `<span class="sub">${o.sub}</span>`:""}
    </button>`;
  }).join("") + `</div>`;
}

function renderEvalStep(){
  const u = DATA[currentLang].evalUI;
  const body = document.getElementById("evalBody");
  let html = "";

  if(evalState.step === 1){
    html += `<div class="eval-step-label">${u.stepLabels[0]}</div><div class="eval-question">${u.q1}</div>`;
    html += optionCardsHTML(u.conditions, "condition", evalState.condition, false);
  }
  else if(evalState.step === 2){
    const sub = u.sub[evalState.condition];
    html += `<div class="eval-step-label">${u.stepLabels[1]}</div><div class="eval-question">${sub.q}</div>`;
    if(sub.helper) html += `<div style="font-size:12.5px;color:var(--ink-soft);margin:-8px 0 12px;">${sub.helper}</div>`;
    html += optionCardsHTML(sub.options, "primary", evalState.primary, false);
    if(sub.q2){
      html += `<div class="eval-question" style="margin-top:18px;">${sub.q2}</div>`;
      html += optionCardsHTML(sub.options2, "secondary", evalState.secondary, false);
    }
  }
  else if(evalState.step === 3){
    html += `<div class="eval-step-label">${u.stepLabels[2]}</div><div class="eval-question">${u.q3}</div>`;
    html += `<div class="duration-row">
      <input type="number" min="0" id="durationInput" placeholder="${u.durationPlaceholder}" value="${evalState.durationValue}">
      <div class="unit-toggle">
        <button type="button" data-unit="days" class="${evalState.durationUnit==="days"?"active":""}">${u.unitDays}</button>
        <button type="button" data-unit="weeks" class="${evalState.durationUnit==="weeks"?"active":""}">${u.unitWeeks}</button>
      </div>
    </div>`;
  }
  else if(evalState.step === 4){
    html += `<div class="eval-step-label">${u.stepLabels[3]}</div><div class="eval-question">${u.q4}</div>`;
    html += `<div style="font-size:12.5px;color:var(--ink-soft);margin:-8px 0 12px;">${u.q4helper}</div>`;
    html += optionCardsHTML(u.metsLevels, "mets", evalState.mets, false).replace('class="option-grid"','class="option-grid single-col"');
  }
  else if(evalState.step === 5){
    html += `<div class="eval-step-label">${u.stepLabels[4]}</div><div class="eval-question">${u.q5}</div>`;
    html += optionCardsHTML(u.activities, "activities", null, true);
  }

  html += `<div class="wizard-nav">
    <button type="button" class="btn btn-ghost" id="evalBack" ${evalState.step===1?"style=\"visibility:hidden;\"":""}>${u.back}</button>
    <button type="button" class="btn btn-primary" id="evalNext" disabled>${evalState.step===5 ? u.getResults : u.next}</button>
  </div>`;

  body.innerHTML = html;
  wireEvalStep();
  updateEvalNextState();
}

function wireEvalStep(){
  document.querySelectorAll("#evalBody .option-card").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const group = btn.dataset.group, val = btn.dataset.val, multi = btn.dataset.multi === "1";
      if(multi){
        const idx = evalState.activities.indexOf(val);
        if(idx === -1) evalState.activities.push(val); else evalState.activities.splice(idx,1);
      } else if(group === "mets"){
        evalState.mets = parseInt(val,10);
      } else {
        evalState[group] = val;
      }
      renderEvalStep();
    });
  });
  const durInput = document.getElementById("durationInput");
  if(durInput){
    durInput.addEventListener("input", ()=>{
      evalState.durationValue = durInput.value;
      updateEvalNextState();
    });
  }
  document.querySelectorAll("#evalBody .unit-toggle button").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      evalState.durationUnit = btn.dataset.unit;
      renderEvalStep();
    });
  });
  const backBtn = document.getElementById("evalBack");
  if(backBtn) backBtn.addEventListener("click", ()=>{
    evalState.step = Math.max(1, evalState.step - 1);
    renderEvalProgress();
    renderEvalStep();
  });
  const nextBtn = document.getElementById("evalNext");
  if(nextBtn) nextBtn.addEventListener("click", ()=>{
    if(evalState.step < 5){
      evalState.step += 1;
      renderEvalProgress();
      renderEvalStep();
    } else {
      renderEvalResults();
    }
  });
}

function updateEvalNextState(){
  const nextBtn = document.getElementById("evalNext");
  if(!nextBtn) return;
  let ok = false;
  if(evalState.step === 1) ok = !!evalState.condition;
  else if(evalState.step === 2){
    const sub = DATA[currentLang].evalUI.sub[evalState.condition];
    ok = !!evalState.primary && (!sub.q2 || !!evalState.secondary);
  }
  else if(evalState.step === 3) ok = evalState.durationValue !== "" && !isNaN(parseFloat(evalState.durationValue)) && parseFloat(evalState.durationValue) >= 0;
  else if(evalState.step === 4) ok = !!evalState.mets;
  else if(evalState.step === 5) ok = evalState.activities.length > 0;
  nextBtn.disabled = !ok;
}

const EVAL_THRESHOLDS = {
  pci:   { drive_private:7,  drive_commercial:42, fly_short:3,  fly_long:10, sex:3,  gym:14, work_desk:7,  work_physical:28 },
  mi:    { drive_private:7,  drive_commercial:42, fly_short:14, fly_long:14, sex:7,  gym:14, work_desk:7,  work_physical:42 },
  cabg:  { drive_private:28, drive_commercial:84, fly_short:14, fly_long:42, sex:42, gym:42, work_desk:14, work_physical:56 },
  other: { drive_private:7,  drive_commercial:42, fly_short:7,  fly_long:14, sex:7,  gym:14, work_desk:7,  work_physical:28 }
};
const EVAL_REQUIRED_METS = { drive_private:1, drive_commercial:3, fly_short:1, fly_long:2, sex:3, gym:2, work_desk:1, work_physical:3 };

function isUnstable(){
  const c = evalState.condition, p = evalState.primary;
  if(c === "angina" && p === "unstable") return true;
  if(c === "mi" && p === "yes") return true;
  if(c === "hf" && (p === "3" || p === "4")) return true;
  if(c === "valve" && p === "severe") return true;
  if(c === "arrhythmia" && p === "uncontrolled") return true;
  if(c === "chd" && p === "significant") return true;
  if(c === "hcm" && p === "severe") return true;
  return false;
}

function fillTemplate(str, params){
  return str.replace(/\{(\w+)\}/g, (m,k)=> params[k] !== undefined ? params[k] : m);
}

function computeResults(){
  const u = DATA[currentLang].evalUI;
  const durDays = evalState.durationUnit === "weeks" ? parseFloat(evalState.durationValue||0) * 7 : parseFloat(evalState.durationValue||0);
  const results = [];

  const unstable = isUnstable();
  let capCaution = null; // reasonKey to force caution regardless of duration/mets
  let cat = "other";
  if(evalState.condition === "pci"){
    cat = "pci";
    if(evalState.secondary === "yes") capCaution = "accessCaution";
  } else if(evalState.condition === "mi"){
    cat = "mi";
  } else if(evalState.condition === "cabg"){
    cat = "cabg";
    if(evalState.primary === "no") capCaution = "healingCaution";
  }

  evalState.activities.forEach(actId=>{
    const actLabel = (u.activities.find(a=>a.id===actId)||{}).label || actId;
    let status, reasonText, extra = [];

    if(unstable){
      status = "defer";
      reasonText = u.reasons.unstable;
    } else if(capCaution){
      status = "caution";
      reasonText = u.reasons[capCaution];
    } else {
      const threshold = EVAL_THRESHOLDS[cat][actId];
      const required = EVAL_REQUIRED_METS[actId];
      if(durDays < threshold){
        status = "wait";
        reasonText = fillTemplate(u.reasons.waitDays, {n:threshold, event:u.eventNames[evalState.condition]});
      } else if(evalState.mets < required){
        status = "caution";
        reasonText = u.reasons.metsLow;
      } else {
        status = "go";
        reasonText = u.reasons.goGeneral;
      }
    }

    if(actId === "drive_commercial" && status !== "defer"){
      extra.push(u.reasons.commercialNote);
    }

    results.push({ actId, actLabel, status, reasonText, extra });
  });

  return results;
}

function renderEvalResults(){
  const u = DATA[currentLang].evalUI;
  const results = computeResults();
  const wrap = document.getElementById("evalResults");
  let html = `<div class="eval-question" style="margin-bottom:2px;">${u.resultsTitle}</div>
    <div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;">${u.resultsSub}</div>`;
  results.forEach(r=>{
    html += `<div class="result-item">
      <div class="result-top">
        <div class="result-activity">${r.actLabel}</div>
        <div class="badge ${r.status}">${u.status[r.status]}</div>
      </div>
      <div class="result-reason">${r.reasonText}${r.extra.length ? " " + r.extra.join(" ") : ""}</div>
    </div>`;
  });
  html += `<div class="eval-disclaimer">${u.disclaimer}</div>
    <button type="button" class="btn btn-ghost eval-restart" id="evalRestart">${u.startOver}</button>`;
  wrap.innerHTML = html;
  wrap.style.display = "block";
  document.getElementById("evalRestart").addEventListener("click", ()=> resetEval(currentLang));
  if(typeof wrap.scrollIntoView === "function") wrap.scrollIntoView({behavior:"smooth", block:"start"});
}

  }).join("\n\n");

  return `You are a warm, careful patient-education assistant embedded inside a "Post-PTCA (angioplasty) Recovery Guide" web app for a cardiology clinic. A patient who has recently had coronary angioplasty/stenting is asking you questions.

Answer ONLY using the guideline content below (based on ESC, ACC/AHA and Indian cardiology society practice recommendations), which is also shown to the patient elsewhere in this app. Keep answers short (2-5 sentences), warm, and practical. Always answer in ${langNames[lang]}, using simple everyday language a patient can understand.

If the patient describes symptoms such as chest pain, severe breathlessness, fainting, palpitations, or heavy bleeding/swelling at the puncture site, tell them clearly to seek emergency medical care immediately, before anything else.

If a question needs personal medical judgement (their specific ejection fraction, medications, complication history, exact clearance date), give the general guidance from below but clearly recommend they confirm the specific timing with their own treating cardiologist.

Do not answer questions unrelated to post-angioplasty recovery and lifestyle; gently redirect to the topic of this guide.

GUIDELINE CONTENT:
${guideText}`;
}

async function sendMessage(){
  const text = chatInput.value.trim();
  if(!text) return;
  chatInput.value = "";
  chatSend.disabled = true;
  addMsg("user", text);
  chatHistory.push({role:"user", content:text});

  const typingEl = addMsg("typing", currentLang==="hi" ? "लिख रहा हूं…" : currentLang==="pa" ? "ਲਿਖ ਰਿਹਾ ਹਾਂ…" : currentLang==="bn" ? "লিখছি…" : "Typing…");
  typingEl.classList.add("typing");

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 500,
        system: buildSystemPrompt(currentLang),
        messages: chatHistory
      })
    });
    const data = await response.json();
    const textBlocks = (data.content || []).filter(b=>b.type==="text").map(b=>b.text);
    const reply = textBlocks.join("\n").trim() || "Sorry, I couldn't process that. Please try again.";
    typingEl.remove();
    addMsg("bot", reply);
    chatHistory.push({role:"assistant", content:reply});
  }catch(err){
    typingEl.remove();
    addMsg("bot", "Sorry, something went wrong reaching the assistant. Please try again in a moment.");
  }finally{
    chatSend.disabled = false;
  }
}

chatSend.addEventListener("click", sendMessage);
chatInput.addEventListener("keydown", (e)=>{
  if(e.key === "Enter") sendMessage();
});

function showBookError(msg){
  const errEl = document.getElementById("bkError");
  if(errEl){ errEl.textContent = msg; errEl.style.display = "block"; }
}

const WA_NUMBER = "919560401055";

function buildWaUrl(msg){ return "https://wa.me/" + WA_NUMBER + "?text=" + encodeURIComponent(msg); }

function handleWhatsAppBooking(lang){
  const d = DATA[lang];
  const name = document.getElementById("bkName").value.trim();
  const phone = document.getElementById("bkPhone").value.trim();
  const date = document.getElementById("bkDate").value;
  const notes = document.getElementById("bkNotes").value.trim();
  const type = d.bookTypeOptions.find(t=>t.id===bookState.type) || d.bookTypeOptions[0];

  if(!name || !phone || !date || !bookState.slot){
    showBookError(d.bookErrRequired);
    return;
  }
  if(!/^\d{10}$/.test(phone)){
    showBookError(d.bookErrPhone);
    return;
  }

  const msg = "Hello, I would like to book a " + type.label + " appointment.\n"
    + "Name: " + name + "\n"
    + "Phone: " + phone + "\n"
    + "Date: " + date + "\n"
    + "Time: " + bookState.slot + "\n"
    + (notes ? "Notes: " + notes + "\n" : "")
    + "Fee: ₹" + type.fee;

  window.open(buildWaUrl(msg), "_blank", "noopener");
}

function handleBookingPayment(lang){
  const d = DATA[lang];
  const name = document.getElementById("bkName").value.trim();
  const phone = document.getElementById("bkPhone").value.trim();
  const email = document.getElementById("bkEmail").value.trim();
  const date = document.getElementById("bkDate").value;
  const notes = document.getElementById("bkNotes").value.trim();
  const type = d.bookTypeOptions.find(t=>t.id===bookState.type) || d.bookTypeOptions[0];

  if(!name || !phone || !date || !bookState.slot){
    showBookError(d.bookErrRequired);
    return;
  }
  if(!/^\d{10}$/.test(phone)){
    showBookError(d.bookErrPhone);
    return;
  }

  bookState.name = name; bookState.phone = phone; bookState.email = email;
  bookState.date = date; bookState.notes = notes;

  const bookingId = generateBookingId();
  const amountPaise = type.fee * 100;

  if(typeof Razorpay === "undefined"){
    // Fallback if Razorpay script failed to load (e.g. offline sandbox)
    finalizeBooking(lang, { id:bookingId, type, payId:"OFFLINE-"+bookingId });
    return;
  }

  const options = {
    key: RAZORPAY_KEY_ID,
    amount: amountPaise,
    currency: "INR",
    name: "CVD & Post-PTCA Recovery Guide",
    description: type.label + " — " + bookState.date + " " + bookState.slot,
    prefill: { name, contact: phone, email },
    notes: { booking_id: bookingId, notes: notes },
    theme: { color: "#1F6F5C" },
    handler: function(response){
      finalizeBooking(lang, { id:bookingId, type, payId: response.razorpay_payment_id || ("PAY-"+bookingId) });
    },
    modal: {
      ondismiss: function(){ /* user closed payment sheet without paying */ }
    }
  };

  try{
    const rzp = new Razorpay(options);
    rzp.open();
  }catch(e){
    finalizeBooking(lang, { id:bookingId, type, payId:"OFFLINE-"+bookingId });
  }
}
